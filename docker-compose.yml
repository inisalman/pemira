services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pemira
      POSTGRES_PASSWORD: pemira
      POSTGRES_DB: pemira_dev
    ports:
      - "5433:5432"
    volumes:
      - pemira_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pemira -d pemira_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pemira_pgdata:
